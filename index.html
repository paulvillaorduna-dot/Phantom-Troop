<!DOCTYPE html>
<html lang="sv">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Log in</title>
        <link rel="stylesheet" href="style.css">
        <script src="scripts.js" defer></script>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Creepster&display=swap" rel="stylesheet">
    </head>
    <body>
        <h1 class="bä">lowkey ba försök.....</h1>

        <div class="login-box">
            <h1>Logga in</h1>

            <div class="input-wrap">
                <div class="ghost">
                    <img src="67.png" alt="Ghost 1">
                    <img src="67.png" alt="Ghost 2">
                    <img src="67.png" alt="Ghost 3">
                </div>
                <input type="text" id="anvandarnamn" placeholder="Användarnamn">
            </div>

            <div class="input-wrap">
                <div class="ghost-losen">
                    <img src="67.png" alt="Ghost 1">
                    <img src="67.png" alt="Ghost 2">
                    <img src="67.png" alt="Ghost 3">
                </div>
                <input type="password" id="losen" placeholder="Lösenord">
            </div>
        </div>

        <div class="support">
            <div class="support-header">Support</div>

            <div class="support-messages">
                <p class="msg bot">Hej. Jag är Support. Jag kan inte hjälpa dig.</p>
            </div>

            <div class="support-input">
                <input type="text" placeholder="Skriv ett meddelande...">
                <button>Skicka</button>
            </div>
        </div>
    </body>
</html>
